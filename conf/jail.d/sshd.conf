# Брутфорс SSH и SSH-сканеры (баннер-граббинг, перебор алгоритмов).
DESCRIPTION="Перебор паролей и сканеры SSH"
ENABLED=yes
SOURCE="journal-tag:sshd,sshd-session"
FILTERS=(
    'Failed (password|publickey|keyboard-interactive/pam) for (invalid user )?.* from <HOST> port'
    'Invalid user .* from <HOST>'
    '(Connection closed by|Disconnected from) (authenticating|invalid) user .* <HOST> port'
    'Unable to negotiate with <HOST> port'
    'banner exchange: Connection from <HOST> port [0-9]+: invalid format'
    'error: kex_exchange_identification: .* <HOST>'
    'Did not receive identification string from <HOST>'
    'maximum authentication attempts exceeded for .* from <HOST>'
)
MAXRETRY=5
FINDTIME=10m
BANTIME=1h
