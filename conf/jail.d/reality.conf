# Невалидные Reality-подключения (активное зондирование Xray).
# Нужен лог ошибок Xray в файле: в профиле конфигурации панели добавьте
#   "log": { "loglevel": "info", "error": "/var/log/remnanode/error.log" }
# (или выполните: fail2detect node logs). Каталог /var/log/remnanode
# уже проброшен в контейнер скриптом eGames.
# ВНИМАНИЕ: за одним IP мобильного оператора (CGNAT) могут быть сотни
# ваших клиентов — порог стоит держать высоким.
DESCRIPTION="Зондирование Reality (нужен лог Xray, см. файл)"
ENABLED=no
SOURCE="file:/var/log/remnanode/error.log"
FILTERS=( 'REALITY: processed invalid connection from (tcp:)?\[?<HOST>\]?:[0-9]+' )
MAXRETRY=20
FINDTIME=5m
BANTIME=1h
