# Анти-флуд банит прямо в ядре (FLOOD_GUARD=yes в fail2detect.conf).
# Этот jail только записывает такие баны в журнал аудита.
DESCRIPTION="Журнал банов анти-флуда (сам бан ставит nftables)"
ENABLED=yes
SOURCE="kernel"
FILTERS=( 'f2d-flood: IN=[^ ]+ .*SRC=<HOST> ' )
MAXRETRY=1
FINDTIME=1m
BANTIME=10m
ACTION=record
