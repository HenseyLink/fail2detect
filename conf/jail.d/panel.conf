# Панель от eGames отвечает 444 всем, кто пришёл без секретной cookie/ключа.
# Тот, кто многократно ломится в панель без ключа, — сканер.
# На сервере «панель+нода» nginx слушает unix-сокет и реальных IP не видит —
# там jail просто ничего не найдёт.
DESCRIPTION="Запросы к панели без секретного ключа (nginx 444)"
ENABLED=no
SOURCE="docker:remnawave-nginx"
FILTERS=( '^<HOST> - [^ ]+ \[[^]]+\] "[^"]*" (444|400) ' )
MAXRETRY=10
FINDTIME=10m
BANTIME=6h
