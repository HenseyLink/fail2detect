# Стук в закрытые порты = сканер. Именно так РКН/«Скипа» ищут VPN-серверы:
# пробегают порты, затем зондируют найденные TLS-сервисы. Ловим на подходе.
# Источник — журнал ядра: [UFW BLOCK] (режим ufw) или f2d-drop (режим nft,
# а также попытки зайти на API ноды не с IP панели).
DESCRIPTION="Сканирование закрытых портов и API ноды"
ENABLED=yes
SOURCE="kernel"
FILTERS=(
    '(\[UFW BLOCK\]|f2d-drop:) IN=[^ ]+ .*SRC=<HOST> '
)
# Только попытки НОВЫХ соединений (SYN) и UDP. Пакеты ACK/FIN/RST — «хвосты»
# обычных соединений, которые conntrack уже забыл (так UFW логирует и вас).
IGNOREREGEX='PROTO=TCP .* (ACK|FIN|RST|PSH) '

# Считаем РАЗНЫЕ закрытые порты: сканер перебирает их десятками, а за одним IP
# мобильного оператора (CGNAT) тысячи абонентов, и их случайные стуки бьют в
# одни и те же порты. Бан не закрывает порты Xray (BAN_SCOPE в fail2detect.conf).
DISTINCT='DPT=([0-9]+)'
MAXRETRY=6
FINDTIME=10m
BANTIME=6h
