# Стук в закрытые порты = сканер. Именно так РКН/«Скипа» ищут VPN-серверы:
# пробегают порты, затем зондируют найденные TLS-сервисы. Ловим на подходе.
# Источник — журнал ядра: [UFW BLOCK] (режим ufw) или f2d-drop (режим nft,
# а также попытки зайти на API ноды не с IP панели).
DESCRIPTION="Сканирование закрытых портов и API ноды"
ENABLED=yes
SOURCE="kernel"
FILTERS=(
    '(\[UFW BLOCK\]|f2d-drop:) IN=[^ ]+ .*SRC=<HOST> '
)
MAXRETRY=3
FINDTIME=10m
BANTIME=1d
