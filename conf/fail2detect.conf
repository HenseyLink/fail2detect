# fail2detect — основной конфиг (/etc/fail2detect/fail2detect.conf)
# После правки: fail2detect fw apply && systemctl restart fail2detect
# Пустое значение = автоопределение.

# Режим фаервола: auto | ufw | nft
#   ufw — порты держит UFW (так настраивает eGames), fail2detect добавляет баны и защиту
#   nft — UFW нет, fail2detect сам закрывает всё лишнее
FW_MODE="auto"

SSH_PORTS=""            # SSH-порты (автоопределение через sshd -T)
PUBLIC_TCP=""           # дополнительные открытые TCP-порты через пробел
PUBLIC_UDP=""
XRAY_PORTS=""           # порты Xray (автоопределение по ss)
NODE_API_PORT=""        # NODE_PORT ноды (автоопределение из docker-compose)
PANEL_IPS=""            # IP панели — единственные, кому открыт API ноды
TRUSTED_IPS=""          # белый список: никогда не банить, пускать на все порты

STEALTH_ICMP="yes"      # не отвечать на ping
DOCKER_GUARD="yes"      # закрыть опубликованные docker-порты, обходящие UFW
FLOOD_GUARD="no"        # бан IP за шквал новых соединений
FLOOD_RATE="600/minute" # ВНИМАНИЕ: за IP мобильного оператора (CGNAT) много клиентов
FLOOD_BANTIME="10m"

# Блок-листы сканеров: имена через пробел, URL — BLOCKLIST_URL_<имя>
BLOCKLISTS="antiscanner skipa"
# BLOCKLIST_URL_mylist="https://example.com/list.txt"

BANTIME_INCREMENT="yes" # повторный бан того же IP вдвое дольше
BANTIME_MAX="30d"
GEO_LOOKUP="yes"        # страна IP в журнале аудита (ip-api.com)

# API панели (для смены порта ноды). Токен можно не указывать —
# fail2detect возьмёт токен скрипта eGames или спросит.
RW_API_URL="http://127.0.0.1:3000"
RW_API_TOKEN=""
RW_API_COOKIE=""        # name=value из ссылки входа eGames, если API панели удалённое

# Сертификаты Let's Encrypt: http (HTTP-01, порт 80 на минуту) | cloudflare (DNS-01)
CERT_METHOD=""
CERT_EMAIL=""

# Уведомления о банах в Telegram
TG_BOT_TOKEN=""
TG_CHAT_ID=""
