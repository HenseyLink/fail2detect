name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -x -s bash fail2detect install.sh lib/*.sh tests/*.sh
      - name: переменные вплотную к не-ASCII (в части локалей bash считает байты частью имени)
        run: |
          if LC_ALL=C grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[\x80-\xFF]' fail2detect install.sh lib/*.sh; then
            echo "Оберните переменную в фигурные скобки: \${name}»"; exit 1
          fi
      - name: bash -n
        run: for f in fail2detect install.sh lib/*.sh conf/jail.d/*.conf; do bash -n "$f"; done

  tests:
    needs: shellcheck
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: tests in ${{ matrix.image }}
        run: RUN_CONFIGS=0 IMAGE=${{ matrix.image }} tests/run.sh

  configs:
    needs: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: xray -test и nginx -t на сгенерированных конфигах
        run: bash tests/configs.sh
