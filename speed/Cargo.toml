[package]
name = "f2d-speed"
version = "1.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "fail2detect: Cloudflare Speedtest с живым дашбордом"
publish = false

[dependencies]
bytes = "1.9.0"
futures = "0.3.31"
libc = "0.2"
rand = "0.8.5"
ratatui = "0.29"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde_json = "1.0.133"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
